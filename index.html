<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grading System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav><b>Grading System</b><button id="theme">🌙</button></nav>
  <main>
    <section class="stats" id="stats"></section>
    <form id="form"></form>
    <div class="bar">
      <input id="search" placeholder="Search student...">
      <select id="sort">
        <option value="new">Newest first</option>
        <option value="name">Name A-Z</option>
        <option value="high">Highest average</option>
        <option value="low">Lowest average</option>
      </select>
      <button id="clear" class="red">Clear All</button>
    </div>
    <div class="wrap">
      <table>
        <thead id="head"></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <p id="empty">No students yet.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
